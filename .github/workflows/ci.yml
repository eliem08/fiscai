name: AVENEL CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: Build & Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: avenel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: |
          npm install --no-fund --no-audit

      - name: Run Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit || true

      - name: Initialize PostgreSQL Roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d avenel -f docker/postgres/init-roles.sql
        env:
          PGPASSWORD: postgres

      - name: Test Migrations Forward (Up)
        run: |
          make migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel

      - name: Test Migrations Rollback (Down)
        run: |
          make migrate-down
          make migrate-down
          make migrate-down
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel

      - name: Re-apply Migrations for Test Suite
        run: |
          make migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel

      - name: Run Lint
        run: |
          make lint
        env:
          PYTHON: python

      - name: Verify Test Count Invariant
        run: |
          python scripts/check_test_count.py
        env:
          PYTHON: python

      - name: Run Typecheck
        run: |
          make typecheck
        env:
          PYTHON: python

      - name: Run OpenAPI Lint
        run: |
          make openapi-lint

      - name: Run RLS Check
        run: |
          make rls-check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel
          PYTHON: python

      - name: Run Hash-Chained Audit Verify
        run: |
          make audit-verify
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel
          PYTHON: python

      - name: Run Automated Tests
        run: |
          make test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel
          PYTHON: python

      - name: Build Web Application
        run: |
          npm run build

      - name: Run Frontend Tests
        run: |
          npm test

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E & Accessibility Suite
        run: |
          npx playwright test e2e/accessibility.spec.ts e2e/pilot-journey.spec.ts
