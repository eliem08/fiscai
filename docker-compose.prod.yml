# Production Docker Compose for AVENEL
# Multi-container stack with Morocco/EU data residency enforcement, non-root execution, healthchecks
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: avenel-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avenel}
      POSTGRES_USER: ${POSTGRES_USER:-avenel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required production database password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
      - wal_archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avenel_admin} -d ${POSTGRES_DB:-avenel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c archive_mode=on
      -c archive_command='cp %p /var/lib/postgresql/wal_archive/%f'
      -c wal_level=replica
      -c max_wal_senders=3
      -c checkpoint_completion_target=0.9

  clamav:
    image: clamav/clamav:1.4.1@sha256:7bc508bfb2a2657e28bcebca693441ef31ce03ca9bbf8787ad36d1eb2f59fa9e
    container_name: avenel-prod-clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "127.0.0.1:3310"]
      interval: 15s
      timeout: 5s
      retries: 5

  freshclam:
    image: clamav/clamav:1.4.1@sha256:7bc508bfb2a2657e28bcebca693441ef31ce03ca9bbf8787ad36d1eb2f59fa9e
    container_name: avenel-prod-freshclam
    restart: unless-stopped
    command: ["freshclam", "-d", "-c", "24"]
    volumes:
      - clamav_db:/var/lib/clamav

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: avenel-prod-api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      ENV: "production"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-avenel_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-avenel}"
      AVENEL_KMS_KEY: "${AVENEL_KMS_KEY:?Required master encryption key}"
      DATA_RESIDENCY_POLICY: "${DATA_RESIDENCY_POLICY:-MA_ONLY}"
      CLAMAV_HOST: "clamav"
      CLAMAV_PORT: "3310"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-filesystem}"
      STORAGE_LOCAL_ROOT: "/app/data/documents"
    volumes:
      - docdata:/app/data/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: avenel-prod-worker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    command: ["python", "-m", "avenel.jobs.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      ENV: "production"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-avenel_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-avenel}"
      AVENEL_KMS_KEY: "${AVENEL_KMS_KEY:?Required master encryption key}"
      DATA_RESIDENCY_POLICY: "${DATA_RESIDENCY_POLICY:-MA_ONLY}"
      CLAMAV_HOST: "clamav"
      CLAMAV_PORT: "3310"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-filesystem}"
      STORAGE_LOCAL_ROOT: "/app/data/documents"
    volumes:
      - docdata:/app/data/documents

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: avenel-prod-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  wal_archive:
  clamav_db:
  docdata:

